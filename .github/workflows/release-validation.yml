name: Release Validation

on:
  workflow_dispatch:

  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  validate-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          VERSION=$(grep "^V=" web-security-audit.py | cut -d"'" -f2)

          echo "VERSION=$VERSION" >> $GITHUB_ENV

          echo "Detected version: $VERSION"

      - name: Verify baseline tools
        run: |
          python3 --version
          curl --version
          openssl version
          zip -v | head -1
          unzip -v | head -1

      - name: Install Nmap (with retries)
        run: |
          set -e

          for i in 1 2 3
          do
            echo "APT update attempt $i/3"

            if sudo apt-get update \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30
            then
              break
            fi

            sleep 15
          done

          sudo apt-get install -y \
            --no-install-recommends \
            nmap

      - name: Verify Nmap
        run: |
          nmap --version | head -1

      - name: Compile Python
        run: |
          python3 -m py_compile web-security-audit.py

      - name: Build release
        run: |
          chmod +x build-release.sh
          ./build-release.sh

      - name: Verify release artifacts
        run: |
          ls -lh releases

          test -f \
            "releases/web-security-audit-${VERSION}.zip"

          test -f \
            "releases/web-security-audit-${VERSION}.zip.sha256"

      - name: Validate checksum
        run: |
          cd releases

          sha256sum -c \
            "web-security-audit-${VERSION}.zip.sha256"

      - name: Extract release package
        run: |
          mkdir -p test-release

          unzip \
            "releases/web-security-audit-${VERSION}.zip" \
            -d test-release

      - name: Validate package structure
        run: |
          test -f test-release/*/web-security-audit.py

          test -f test-release/*/install.sh

          test -f test-release/*/README.md

          test -f \
            test-release/*/profiles/profile-web-security-external.json

          test -f \
            test-release/*/config/audit-config.example.json

          test -f \
            test-release/*/docs/MANUAL.md

          test -f \
            test-release/*/docs/MANUAL-GITHUB.md

      - name: Validate configuration
        run: |
          cd test-release/*

          python3 -m py_compile web-security-audit.py

          python3 web-security-audit.py \
            --validate-only \
            -c config/audit-config.example.json \
            -p profiles/profile-web-security-external.json